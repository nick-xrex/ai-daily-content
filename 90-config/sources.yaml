  # disabled: medium-tag-ai is open to any author posting `ai`-tagged content,
  # which is heavily polluted with Persian "شماره خاله" spam + listicles. The
  # Arabic-script filter in rss.py blocks the spam, but the remaining items are
  # mostly low-quality clickbait. medium-tag-llm / medium-tag-claude cover the
  # actual AI signal from Medium.
  # - name: medium-tag-ai
  #   kind: rss
  #   url: https://medium.com/feed/tag/artificial-intelligence
  #   tier: 2
  #   source_weight: 0.5
  - name: medium-tag-llm
    kind: rss
    url: https://medium.com/feed/tag/large-language-models
    tier: 2
    source_weight: 0.6
  - name: medium-tag-claude
    kind: rss
    url: https://medium.com/feed/tag/claude
    tier: 2
    source_weight: 0.7
  # disabled: medium-stackademic is mostly listicles ("10 things you should
