# Daily digest columns (專欄) — user-curated scenario sections that appear on
# every rollup below the 📚 分類摘要 section. Each column is populated by the
# rollup LLM when insights match, and gets a "（今日無相關內容）" placeholder
# otherwise. Order here = display order.
#
# Schema per column:
#   id:           stable identifier (kebab-case)
#   display_name: emoji + zh-TW heading (≤ 20 chars recommended)
#   prompt:       one-line guide to the LLM about what content belongs here
#   filter:       optional — topics/tags/keywords to narrow LLM selection
#     topics:   list of topic_ids from keywords.yaml
#     tags:     list of tag strings (substring match on insight.tags)
#     keywords: list of substrings to match in summary_zh (case-insensitive)
#   min_items:    minimum insights needed to populate (default 1)
#
# Example columns — edit freely. Leave list empty to hide the whole section.

columns:
  - id: claude-code-updates
    display_name: "🛠 Claude Code / Codex 新功能"
    prompt: "今天 Claude Code、Codex、或相關 coding-agent 工具的功能更新、release notes、實用技巧。每筆帶版本號或 commit hash。"
    filter:
      keywords: ["claude code", "codex", "cursor", "windsurf", "aider", "cline"]
    min_items: 1

  - id: ai-knowledge-mgmt
    display_name: "📚 AI 知識管理"
    prompt: "AI 輔助的個人 / 團隊知識管理：RAG 系統、second-brain 工具、Obsidian + AI 整合、企業內部知識檢索、文件摘要自動化、筆記組織、prompt library 管理、memory system。"
    filter:
      keywords: ["knowledge management", "rag", "retrieval augmented", "second brain",
                 "obsidian", "notion ai", "knowledge base", "memory system",
                 "prompt library", "semantic search", "embedding", "vector db",
                 "vector database", "knowledge graph"]
    min_items: 1

  - id: enterprise-ai-adoption
    display_name: "🏢 企業導入 AI / 團隊實踐"
    prompt: "企業 / 團隊導入 AI 的**實踐面**，不只是宣布而是 how：(1) 大型企業部署案例（ChatGPT Enterprise、Claude for Enterprise、Copilot Business）(2) 產業應用（金融 / 醫療 / 製造 / 零售 / 法務 / 教育）(3) **AI 團隊管理 / 組織設計**：誰負責 AI、AI champion、platform team、AI enablement (4) **MCP server / 內部工具整合**：企業如何用 MCP 接內部系統 (5) **技能養成 / training**：員工 AI literacy、評估框架、hiring rubric (6) **AI 治理 / 合規**：governance、data privacy、model policy (7) **ROI / 效益量化**：productivity study、cost model、case study"
    filter:
      keywords: [
        # Enterprise products + rollouts
        "enterprise", "chatgpt enterprise", "claude for enterprise",
        "copilot for business", "ai adoption", "ai transformation",
        "deployment", "rollout", "case study", "pilot",
        # Team + org design
        "team", "team lead", "ai champion", "ai team", "platform team",
        "ai enablement", "enablement", "center of excellence",
        "ai strategy", "chief ai", "cado",
        # Skills + training
        "training", "upskill", "ai literacy", "workshop", "onboarding",
        "evaluation framework", "hiring", "interview", "rubric",
        "skill", "skills", "learning path",
        # MCP + internal tooling
        "mcp", "mcp server", "internal tool", "integration",
        "knowledge base integration", "api gateway",
        # Governance + compliance
        "ai governance", "data privacy", "model policy", "compliance",
        "responsible ai", "audit",
        # ROI / metrics
        "roi", "productivity", "cost model", "savings", "efficiency",
        # Industries
        "金融", "fintech", "healthcare", "medical", "manufacturing",
        "retail", "legal", "education", "教育",
        # Chinese
        "企業", "導入", "部署", "治理", "合規", "團隊",
        "組織", "培訓", "技能", "技能養成", "管理"
      ]
    min_items: 1

  - id: ai-techniques
    display_name: "🎓 AI 使用技巧 / 心法"
    prompt: "實用的 AI 使用技巧、prompting 心法、workflow pattern、tool combination：包括 prompt engineering 技巧、context 管理、agent 工作流、multi-tool orchestration、model selection 策略、cost optimization、debug 方法、evaluation 技巧。重點在「讀完就可以馬上套用」的具體手法。"
    filter:
      keywords: ["prompt", "prompting", "technique", "trick", "tip", "pattern",
                 "workflow", "recipe", "best practice", "how to", "guide",
                 "context", "system prompt", "chain of thought", "few-shot",
                 "agent pattern", "orchestration", "evaluation", "eval",
                 "技巧", "心法", "手法", "套路", "方法"]
    min_items: 1

  - id: payment-fintech
    display_name: "💳 支付 / Fintech"
    prompt: "支付與金融科技相關：傳統支付（Visa/Mastercard/Stripe/PayPal）、跨境匯款、穩定幣支付、CBDC、數位錢包、remittance、merchant acquiring、card issuing、PCI 合規、KYC/AML、fraud detection、risk engine、reconciliation、支付基礎設施、open banking。AI 與支付的交集（fraud AI、chargeback prediction、onboarding AI）特別重要。"
    filter:
      keywords: [
        "payment", "payments", "stablecoin", "usdc", "usdt", "cbdc",
        "remittance", "cross-border", "card issuing", "acquirer", "merchant",
        "stripe", "visa", "mastercard", "paypal", "adyen", "checkout",
        "kyc", "aml", "fraud", "chargeback", "pci", "compliance",
        "open banking", "digital wallet", "e-money", "gateway",
        "fintech", "neobank", "bnpl",
        "支付", "匯款", "跨境", "穩定幣", "錢包", "清算", "結算",
        "金融科技", "詐欺", "風控", "合規"
      ]
    min_items: 1

  - id: blockchain-crypto
    display_name: "⛓️ 區塊鏈 / Web3"
    prompt: "區塊鏈、加密貨幣、Web3：公鏈動態（Ethereum/Solana/Bitcoin L2）、L2（Arbitrum/Optimism/Base）、DeFi protocols（lending/DEX/derivatives）、MEV、validator economics、on-chain data、token 經濟、NFT、DAO、Web3 infrastructure、restaking、RWA tokenization。AI 與區塊鏈的交集（on-chain agents、TEE、decentralized AI）優先。"
    filter:
      keywords: [
        "blockchain", "crypto", "bitcoin", "ethereum", "solana",
        "defi", "dex", "lending", "staking", "restaking", "mev",
        "layer 2", "layer-2", "rollup", "arbitrum", "optimism", "base",
        "zk-", "zero-knowledge", "validator", "consensus",
        "nft", "dao", "web3", "smart contract", "tokenomics",
        "rwa", "real world asset", "tokenization",
        "on-chain", "onchain", "wallet", "dapp",
        "區塊鏈", "加密", "比特幣", "以太坊", "智能合約",
        "代幣", "鏈上", "去中心化"
      ]
    min_items: 1

  - id: ledger-accounting
    display_name: "📒 帳務架構 / Ledger"
    prompt: "帳務系統與 ledger 架構：double-entry bookkeeping、journal entry、general ledger、reconciliation、transaction matching、event sourcing for financial records、multi-currency accounting、cost center allocation、SOX compliance、audit trail、GL/AP/AR、close process 自動化、blockchain ledger design（UTXO vs account model）、高頻交易系統的 ledger 正確性、distributed transaction。實務導向的系統設計優先。"
    filter:
      keywords: [
        "ledger", "double-entry", "double entry", "bookkeeping",
        "journal entry", "general ledger", "gl account", "accounting",
        "reconciliation", "reconcile", "transaction matching",
        "event sourcing", "close process", "period close",
        "audit trail", "sox", "sarbanes-oxley",
        "multi-currency", "fx accounting", "cost center",
        "gaap", "ifrs", "fasb",
        "utxo", "account model", "balance sheet",
        "chart of accounts", "debit credit",
        "帳務", "分錄", "總帳", "對帳", "會計", "記帳",
        "結算", "清算", "財報"
      ]
    min_items: 1

  - id: ai-security
    display_name: "🔐 AI 安全 / 濫用"
    prompt: "AI 相關的資安事件、濫用偵測、紅隊研究、對抗攻擊、prompt injection、模型供應鏈。對加密資產/金融詐騙場景特別重要。"
    filter:
      keywords: ["security", "exploit", "jailbreak", "red team", "adversarial",
                 "prompt injection", "supply chain", "fraud", "scam"]
    min_items: 1

