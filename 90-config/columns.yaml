# Daily digest columns (專欄) — user-curated scenario sections that appear on
# every rollup below the 📚 分類摘要 section. Each column is populated by the
# rollup LLM when insights match, and gets a "（今日無相關內容）" placeholder
# otherwise. Order here = display order.
#
# Schema per column:
#   id:           stable identifier (kebab-case)
#   display_name: emoji + zh-TW heading (≤ 20 chars recommended)
#   prompt:       one-line guide to the LLM about what content belongs here
#   filter:       optional — topics/tags/keywords to narrow LLM selection
#     topics:   list of topic_ids from keywords.yaml
#     tags:     list of tag strings (substring match on insight.tags)
#     keywords: list of substrings to match in summary_zh (case-insensitive)
#   min_items:    minimum insights needed to populate (default 1)
#
# Example columns — edit freely. Leave list empty to hide the whole section.

columns:
  - id: claude-code-updates
    display_name: "🛠 Claude Code / Codex 新功能"
    prompt: "今天 Claude Code、Codex、或相關 coding-agent 工具的功能更新、release notes、實用技巧。每筆帶版本號或 commit hash。"
    filter:
      keywords: ["claude code", "codex", "cursor", "windsurf", "aider", "cline"]
    min_items: 1

  - id: ai-knowledge-mgmt
    display_name: "📚 AI 知識管理"
    prompt: "AI 輔助的個人 / 團隊知識管理：RAG 系統、second-brain 工具、Obsidian + AI 整合、企業內部知識檢索、文件摘要自動化、筆記組織、prompt library 管理、memory system。"
    filter:
      keywords: ["knowledge management", "rag", "retrieval augmented", "second brain",
                 "obsidian", "notion ai", "knowledge base", "memory system",
                 "prompt library", "semantic search", "embedding", "vector db",
                 "vector database", "knowledge graph"]
    min_items: 1

  - id: enterprise-ai-adoption
    display_name: "🏢 企業導入 AI"
    prompt: "企業 / 組織導入 AI 的案例、策略、治理、ROI、change management：包括大型企業 AI 部署（ChatGPT Enterprise、Claude for Enterprise）、產業應用（金融 / 醫療 / 製造 / 零售 / 法務）、AI 治理框架、合規、採購決策、組織變革、培訓。"
    filter:
      keywords: ["enterprise", "chatgpt enterprise", "claude for enterprise",
                 "copilot for business", "ai governance", "ai adoption",
                 "ai transformation", "roi", "case study", "deployment",
                 "compliance", "企業", "導入", "部署", "治理", "合規",
                 "金融", "fintech", "healthcare", "medical", "manufacturing",
                 "retail", "legal"]
    min_items: 1

  - id: ai-security
    display_name: "🔐 AI 安全 / 濫用"
    prompt: "AI 相關的資安事件、濫用偵測、紅隊研究、對抗攻擊、prompt injection、模型供應鏈。對加密資產/金融詐騙場景特別重要。"
    filter:
      keywords: ["security", "exploit", "jailbreak", "red team", "adversarial",
                 "prompt injection", "supply chain", "fraud", "scam"]
    min_items: 1

